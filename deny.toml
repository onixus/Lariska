# cargo-deny configuration for CI (Plan.md §16 "dependency license policy").
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
# Every license actually present in the dependency tree as of the last
# `cargo deny check licenses` run — all standard permissive licenses.
# Re-run that command and extend this list (never just delete the failure)
# if a new dependency introduces something outside this set.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Skips this crate's own license check — it's `publish = false` (Cargo.toml)
# and its Cargo.toml `license = "UNLICENSED"` isn't a real SPDX term, it just
# means "not for redistribution."
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
