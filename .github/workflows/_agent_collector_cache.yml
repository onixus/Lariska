name: Apply collector cache

on:
  push:
    branches:
      - perf/collector-cache

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/collector-cache
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Wire cache and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("src/inventory/mod.rs")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "pub mod environment;\npub mod runtimes;\n",
              "mod cache;\npub mod environment;\npub mod runtimes;\n",
              "cache module declaration",
          )
          text = replace_once(
              text,
              "#[derive(Debug)]\npub struct CollectorResult {",
              "#[derive(Clone, Debug, serde::Serialize, serde::Deserialize)]\npub struct CollectorResult {",
              "CollectorResult derives",
          )
          collect_all = """pub async fn collect_all() -> CollectorResult {
              collect_all_with_timeout(DEFAULT_COLLECTOR_TIMEOUT).await
          }
          """
          collect_all_cached = collect_all + """
          /// Uses persistent per-collector fingerprints for the daemon path.
          /// Diagnostic collection deliberately bypasses this so an operator
          /// asking for inventory always gets a fresh read of the host.
          pub async fn collect_all_cached(state_dir: &Path, max_age: Duration) -> CollectorResult {
              cache::collect_all_cached(state_dir, DEFAULT_COLLECTOR_TIMEOUT, max_age).await
          }
          """
          text = replace_once(text, collect_all, collect_all_cached, "cached entry point")
          path.write_text(text, encoding="utf-8")

          for file_name, old, new in [
              (
                  "src/inventory/runtimes/python.rs",
                  "fn candidate_python_dirs() -> Vec<PathBuf>",
                  "pub(crate) fn candidate_python_dirs() -> Vec<PathBuf>",
              ),
              (
                  "src/inventory/runtimes/nodejs.rs",
                  "fn candidate_node_modules_dirs() -> Vec<PathBuf>",
                  "pub(crate) fn candidate_node_modules_dirs() -> Vec<PathBuf>",
              ),
              (
                  "src/inventory/runtimes/java.rs",
                  "fn candidate_jvm_dirs() -> Vec<PathBuf>",
                  "pub(crate) fn candidate_jvm_dirs() -> Vec<PathBuf>",
              ),
          ]:
              runtime_path = Path(file_name)
              runtime_text = runtime_path.read_text(encoding="utf-8")
              runtime_text = replace_once(runtime_text, old, new, file_name)
              runtime_path.write_text(runtime_text, encoding="utf-8")

          path = Path("src/app.rs")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "        &hostname,\n        runtime_rx,\n        shutdown_rx,\n    );",
              "        &hostname,\n        &config.state_dir,\n        config.inventory_full_refresh_interval,\n        runtime_rx,\n        shutdown_rx,\n    );",
              "inventory loop call",
          )
          text = replace_once(
              text,
              "    hostname: &str,\n    mut runtime: tokio::sync::watch::Receiver<managed::Runtime>,\n    mut shutdown: tokio::sync::watch::Receiver<bool>,\n) {\n    let initial_delay",
              "    hostname: &str,\n    state_dir: &Path,\n    cache_max_age: Duration,\n    mut runtime: tokio::sync::watch::Receiver<managed::Runtime>,\n    mut shutdown: tokio::sync::watch::Receiver<bool>,\n) {\n    let initial_delay",
              "inventory loop signature",
          )
          text = replace_once(
              text,
              "collect_and_submit(delivery_client, agent_id, hostname).await",
              "collect_and_submit(delivery_client, agent_id, hostname, state_dir, cache_max_age).await",
              "cached collection call",
          )
          text = replace_once(
              text,
              "    hostname: &str,\n) -> Result<(), String> {\n    let collected = inventory::collect_all().await;",
              "    hostname: &str,\n    state_dir: &Path,\n    cache_max_age: Duration,\n) -> Result<(), String> {\n    let collected = inventory::collect_all_cached(state_dir, cache_max_age).await;",
              "collect_and_submit signature",
          )
          path.write_text(text, encoding="utf-8")
          PY

          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_agent_collector_cache.yml
          git add src/app.rs src/inventory
          git commit -m "perf: cache unchanged inventory collectors"
          git push origin HEAD:perf/collector-cache
