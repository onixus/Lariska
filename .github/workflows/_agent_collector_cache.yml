name: Apply collector cache

on:
  push:
    branches:
      - perf/collector-cache

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/collector-cache
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Wire cache and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/inventory/mod.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'use crate::model::SoftwareEntry;\nuse std::time::{Duration, Instant};\n',
              'use crate::model::SoftwareEntry;\nuse std::path::{Path, PathBuf};\nuse std::time::{Duration, Instant};\n',
              1,
          )
          text = text.replace(
              'pub mod environment;\npub mod runtimes;\n',
              'mod cache;\npub mod environment;\npub mod runtimes;\n',
              1,
          )
          text = text.replace(
              '#[derive(Debug)]\npub struct CollectorResult {',
              '#[derive(Clone, Debug, serde::Serialize, serde::Deserialize)]\npub struct CollectorResult {',
              1,
          )
          text = text.replace(
              '''pub async fn collect_all() -> CollectorResult {
              collect_all_with_timeout(DEFAULT_COLLECTOR_TIMEOUT).await
          }
          ''',
              '''pub async fn collect_all() -> CollectorResult {
              collect_all_with_timeout(DEFAULT_COLLECTOR_TIMEOUT).await
          }

          /// Uses persistent per-collector fingerprints for the daemon path.
          /// Diagnostic collection deliberately bypasses this so an operator
          /// asking for inventory always gets a fresh read of the host.
          pub async fn collect_all_cached(state_dir: &Path, max_age: Duration) -> CollectorResult {
              cache::collect_all_cached(state_dir, DEFAULT_COLLECTOR_TIMEOUT, max_age).await
          }
          ''',
              1,
          )
          text = text.replace('\nuse std::path::{Path, PathBuf};\n\n#[cfg(target_os = "linux")]', '\n#[cfg(target_os = "linux")]', 1)
          path.write_text(text, encoding='utf-8')

          for file_name, old, new in [
              ('src/inventory/runtimes/python.rs', 'fn candidate_python_dirs() -> Vec<PathBuf>', 'pub(crate) fn candidate_python_dirs() -> Vec<PathBuf>'),
              ('src/inventory/runtimes/nodejs.rs', 'fn candidate_node_modules_dirs() -> Vec<PathBuf>', 'pub(crate) fn candidate_node_modules_dirs() -> Vec<PathBuf>'),
              ('src/inventory/runtimes/java.rs', 'fn candidate_jvm_dirs() -> Vec<PathBuf>', 'pub(crate) fn candidate_jvm_dirs() -> Vec<PathBuf>'),
          ]:
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              assert old in text, (file_name, old)
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('src/app.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let inventory_loop = inventory_loop(
              &delivery_client,
              &identity.agent_id,
              &hostname,
              runtime_rx,
              shutdown_rx,
          );
          '''
          new = '''    let inventory_loop = inventory_loop(
              &delivery_client,
              &identity.agent_id,
              &hostname,
              &config.state_dir,
              config.inventory_full_refresh_interval,
              runtime_rx,
              shutdown_rx,
          );
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''async fn inventory_loop(
              delivery_client: &DeliveryClient,
              agent_id: &str,
              hostname: &str,
              mut runtime: tokio::sync::watch::Receiver<managed::Runtime>,
              mut shutdown: tokio::sync::watch::Receiver<bool>,
          ) {
          '''
          new = '''async fn inventory_loop(
              delivery_client: &DeliveryClient,
              agent_id: &str,
              hostname: &str,
              state_dir: &Path,
              cache_max_age: Duration,
              mut runtime: tokio::sync::watch::Receiver<managed::Runtime>,
              mut shutdown: tokio::sync::watch::Receiver<bool>,
          ) {
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = 'collect_and_submit(delivery_client, agent_id, hostname).await'
          new = 'collect_and_submit(delivery_client, agent_id, hostname, state_dir, cache_max_age).await'
          assert old in text
          text = text.replace(old, new, 1)

          old = '''async fn collect_and_submit(
              delivery_client: &DeliveryClient,
              agent_id: &str,
              hostname: &str,
          ) -> Result<(), String> {
              let collected = inventory::collect_all().await;
          '''
          new = '''async fn collect_and_submit(
              delivery_client: &DeliveryClient,
              agent_id: &str,
              hostname: &str,
              state_dir: &Path,
              cache_max_age: Duration,
          ) -> Result<(), String> {
              let collected = inventory::collect_all_cached(state_dir, cache_max_age).await;
          '''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_agent_collector_cache.yml
          git add src/app.rs src/inventory
          git commit -m "perf: cache unchanged inventory collectors"
          git push origin HEAD:perf/collector-cache
